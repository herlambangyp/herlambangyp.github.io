<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    #status {
      text-align: center;
    }
  </style>
</head>

<body>

<div id="status">Menyiapkan download...</div>
<script src="versi.js"></script>

<script>
  const status = document.getElementById('status')
  const daftarFile = {
    'dataset-hrf-jpn.txt': 'dataset/dataset-hrf-jpn.txt',
    'quiz.html': 'quiz.html',
  }
  const params = new URLSearchParams(location.search)
  const namaFile = params.get('file')

  if (!namaFile) {
    status.textContent = '❌ Nama file tidak ditemukan'
  }

  else if (!daftarFile[namaFile]) {
    status.textContent = '❌ File tidak diizinkan'
  }

  else {
    const pathFile = daftarFile[namaFile]
    const link = document.createElement('a')
    link.href = pathFile
    if (namaFile === 'quiz.html') {
      link.download = `Quiz v${dataServer.versi}.html`
    } else {
      link.download = namaFile
    }
    document.body.appendChild(link)
    link.click()
    link.remove()
    status.textContent = `⬇️ Mengunduh ${namaFile}...`
    setTimeout(() => {
      window.close()
    }, 1000)
  }
</script>
</body>
</html>
