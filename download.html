<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    #status {
      text-align: center;
    }
  </style>
</head>

<body>
<div id="status" style="display: flex; align-items: flex-end; gap: 4px;"></div>
<script src="versi.js"></script>

<script>
  const status = document.getElementById('status'),
  iconDownload =`  
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>`,
  daftarFile = {
    'dataset-hrf-jpn.txt': 'dataset/dataset-hrf-jpn.txt',
    'quiz.html': 'quiz.html',
    'HYP-lebar-putih' :'foto/ktp-lebar-putih.png',
    'HYP-foto' :'foto/ktp.jpg',
    'HYP-lebar' : 'foto/ktp-lebar.png',
    'JFT-HYP' : 'doc/jft.pdf',

  },
  params = new URLSearchParams(location.search),
  namaFile = params.get('file')

  if (!namaFile) {
    status.textContent = 'File tidak ditemukan ❌'
  }

  else if (!daftarFile[namaFile]) {
    status.textContent = 'File tidak ditemukan ❌'
  }

  else {
    const pathFile = daftarFile[namaFile]
    const link = document.createElement('a')
    link.href = pathFile
    if (namaFile === 'quiz.html') {
      link.download = `Quiz v${dataServer.versi}.html`
    } else {
      link.download = '#'+namaFile
    }
    document.body.appendChild(link)
    console.log('namaFile:', namaFile)
    console.log('pathFile:', pathFile)
    console.log('versi:', dataServer.versi)
    console.log('download:', link.download)
    link.click()
    link.remove()
    status.innerHTML = iconDownload + `Mendownload: ${namaFile}...`
    setTimeout(() => {
      window.close()
    }, 1000)
  }
</script>
</body>
</html>
